name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Dependency vulnerability gate. Non-blocking for now because Next.js
      # 14.2.x carries known advisories whose only fix is a 15.x major upgrade
      # (see AUDIT.md N1); flip continue-on-error to false once that lands.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
